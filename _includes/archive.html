{% assign current = page.url %}
{% if page.url == "/" %}{% assign current = site.posts.first.url %}{% endif %}
<nav class="archive">
  <h2>All posts</h2>
  <ul>
    {% for p in site.posts %}
    <li{% if p.url == current %} class="current"{% endif %}>
      <time datetime="{{ p.date | date_to_xmlschema }}">{{ p.date | date: "%Y-%m-%d" }}</time>
      <a href="{{ p.url | relative_url }}">{{ p.title }}</a>
    </li>
    {% endfor %}
  </ul>
</nav>
