<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  {% feed_meta %}
  <style>
    /* Palette and type match erndip.github.io (src/index.css, src/App.module.css) */
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg-primary: #071531;
      --bg-secondary: #13213e;
      --bg-card: #040404;
      --accent: #4f9cf9;
      --text-primary: #e1e8f0;
      --text-secondary: #7d90a8;
      --border: #1e2d45;
    }
    html {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      color-scheme: dark;
    }
    body { margin: 0; background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 0 1.5rem; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 4rem 0 2.5rem; border-bottom: 1px solid var(--border); }
    .site-title { font-size: 3rem; font-weight: 700; letter-spacing: -0.5px; color: var(--text-primary); }
    .site-title:hover { text-decoration: none; }
    .tagline { margin: 0.5rem 0 0; color: var(--text-secondary); font-size: 1.05rem; }
    main { flex: 1; padding-top: 3rem; }

    article h1 { margin: 0; font-size: 2rem; line-height: 1.25; letter-spacing: -0.3px; }
    article h1 a { color: var(--text-primary); }
    article h2, article h3 { margin-top: 2rem; line-height: 1.3; }
    time { color: var(--text-secondary); font-size: 0.875rem; }
    img { max-width: 100%; border-radius: 8px; }
    pre { overflow-x: auto; padding: 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; }
    code { font-size: 0.9em; }
    :not(pre) > code { padding: 0.1em 0.35em; background: var(--bg-secondary); border-radius: 4px; }
    blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--text-secondary); }
    hr { border: 0; border-top: 1px solid var(--border); }

    .comments { margin-top: 3rem; }
    .archive { margin-top: 3rem; padding-top: 2.5rem; border-top: 1px solid var(--border); }
    .archive h2 {
      margin: 0 0 1.25rem; font-size: 0.8rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-secondary);
    }
    .archive ul { list-style: none; margin: 0; padding: 0; }
    .archive li { display: flex; gap: 1rem; padding: 0.3rem 0; }
    .archive time { flex: 0 0 6rem; }
    .archive .current a { color: var(--text-primary); font-weight: 600; }

    footer { margin-top: 3rem; padding: 2rem 0; border-top: 1px solid var(--border); font-size: 0.875rem; display: flex; justify-content: space-between; }
    footer a { color: var(--text-secondary); }
    footer a:hover { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="tagline">{{ site.description }}</p>
    </header>
    <main>
      {{ content }}
    </main>
    {% include archive.html %}
    <footer>
      <a href="{{ site.url }}">&larr; erndip.github.io</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </footer>
  </div>
</body>
</html>
